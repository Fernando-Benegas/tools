  contact:
    name: httpbin
    url: "https://httpbin.org"
  license:
    name: MIT
    url: "https://opensource.org/licenses/MIT"

servers:
  - url: https://httpbin.org

tags:
  - name: methods
  - name: inspection
  - name: auth
  - name: status
  - name: encoding
  - name: redirects
  - name: cookies
  - name: cache
  - name: formats
  - name: misc

paths:

  /get:
    get:
      tags: [methods]
      summary: GET request
      operationId: get
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /post:
    post:
      tags: [methods]
      summary: POST request
      operationId: post
      requestBody:
        $ref: "#/components/requestBodies/GenericBody"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /put:
    put:
      tags: [methods]
      summary: PUT request
      operationId: put
      requestBody:
        $ref: "#/components/requestBodies/GenericBody"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /patch:
    patch:
      tags: [methods]
      summary: PATCH request
      operationId: patch
      requestBody:
        $ref: "#/components/requestBodies/GenericBody"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /delete:
    delete:
      tags: [methods]
      summary: DELETE request
      operationId: delete
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /anything:
    get:
      tags: [inspection]
      operationId: anythingGet
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /anything/{path}:
    get:
      tags: [inspection]
      operationId: anythingWithPath
      parameters:
        - $ref: "#/components/parameters/PathParam"
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /headers:
    get:
      tags: [inspection]
      operationId: headers
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /ip:
    get:
      tags: [inspection]
      operationId: ip
      responses:
        "200":
          description: IP response
          content:
            application/json:
              schema:
                type: object
                properties:
                  origin:
                    type: string

  /user-agent:
    get:
      tags: [inspection]
      operationId: userAgent
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /uuid:
    get:
      tags: [inspection]
      operationId: uuid
      responses:
        "200":
          description: UUID
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string

  /status/{code}:
    get:
      tags: [status]
      operationId: status
      parameters:
        - $ref: "#/components/parameters/StatusCode"
      responses:
        "200":
          description: Status returned
        "400":
          $ref: "#/components/responses/badRequest"

  /delay/{n}:
    get:
      tags: [status]
      operationId: delay
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /redirect/{n}:
    get:
      tags: [redirects]
      operationId: redirect
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: Redirect

  /redirect-to:
    get:
      tags: [redirects]
      operationId: redirectTo
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect

  /relative-redirect/{n}:
    get:
      tags: [redirects]
      operationId: relativeRedirect
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: Redirect

  /gzip:
    get:
      tags: [encoding]
      operationId: gzip
      responses:
        "200":
          description: Gzip response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpBinResponse"

  /deflate:
    get:
      tags: [encoding]
      operationId: deflate
      responses:
        "200":
          description: Deflate response

  /base64/{value}:
    get:
      tags: [encoding]
      operationId: base64Decode
      parameters:
        - name: value
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Decoded string

  /stream-bytes/{n}:
    get:
      tags: [misc]
      operationId: streamBytes
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Binary stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /response-headers:
    get:
      tags: [misc]
      operationId: responseHeaders
      parameters:
        - name: freeform
          in: query
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /cookies:
    get:
      tags: [cookies]
      operationId: getCookies
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /cookies/set:
    get:
      tags: [cookies]
      operationId: setCookies
      parameters:
        - name: key
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Cookie set

  /cache:
    get:
      tags: [cache]
      operationId: cache
      responses:
        "200":
          description: Cache response
        "304":
          description: Not modified

  /etag/{etag}:
    get:
      tags: [cache]
      operationId: etag
      parameters:
        - name: etag
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "304":
          description: Not modified

  /html:
    get:
      tags: [formats]
      operationId: html
      responses:
        "200":
          description: HTML response
          content:
            text/html:
              schema:
                type: string

  /xml:
    get:
      tags: [formats]
      operationId: xml
      responses:
        "200":
          description: XML response
          content:
            application/xml:
              schema:
                type: string

  /json:
    get:
      tags: [formats]
      operationId: json
      responses:
        "200":
          $ref: "#/components/responses/JsonResponse"

  /image/png:
    get:
      tags: [formats]
      operationId: imagePng
      responses:
        "200":
          content:
            image/png:
              schema:
                type: string
                format: binary

components:

  parameters:
    StatusCode:
      name: code
      in: path
      required: true
      schema:
        type: integer

    PathParam:
      name: path
      in: path
      required: true
      schema:
        type: string

  requestBodies:
    GenericBody:
      content:
        application/json:
          schema:
            type: object
        application/x-www-form-urlencoded:
          schema:
            type: object

  responses:
    JsonResponse:
      description: Standard JSON response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpBinResponse"

    badRequest:
      description: Bad request

  schemas:
    HttpBinResponse:
      type: object
      properties:
        args:
          type: object
          additionalProperties:
            type: string
        headers:
          type: object
          additionalProperties:
            type: string
        origin:
          type: string
        url:
          type: string
        data:
          type: string
        json:
          nullable: true
          type: object
        form:
          type: object
          additionalProperties:
            type: string
        files:
          type: object
          additionalProperties:
            type: string

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
