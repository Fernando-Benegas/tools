openapi: 3.0.3
info:
  title: httpbin API
  description: A simple HTTP request & response service for testing HTTP libraries.
  version: "1.0.0"

servers:
  - url: https://httpbin.org
    description: Official httpbin server

tags:
  - name: HTTP Methods
  - name: Auth
  - name: Status

paths:

  /get:
    get:
      tags: [HTTP Methods]
      summary: Returns GET request data
      description: Returns query parameters, headers, and origin.
      parameters:
        - in: query
          name: any
          schema:
            type: string
          description: Arbitrary query parameter
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object

  /post:
    post:
      tags: [HTTP Methods]
      summary: Returns POST request data
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object

  /put:
    put:
      tags: [HTTP Methods]
      summary: Returns PUT request data
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object

  /delete:
    delete:
      tags: [HTTP Methods]
      summary: Returns DELETE request data
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object

  /anything:
    get:
      tags: [HTTP Methods]
      summary: Returns anything passed in request
      responses:
        "200":
          description: Echo response
          content:
            application/json:
              schema:
                type: object
    post:
      tags: [HTTP Methods]
      summary: Accepts and returns any data
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Echo response
          content:
            application/json:
              schema:
                type: object

  /status/{code}:
    get:
      tags: [Status]
      summary: Returns given HTTP status code
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: integer
          description: HTTP status code to return
      responses:
        "200":
          description: Status returned successfully
        "400":
          description: Bad request
        "404":
          description: Not found

  /basic-auth/{user}/{passwd}:
    get:
      tags: [Auth]
      summary: Basic authentication endpoint
      parameters:
        - in: path
          name: user
          required: true
          schema:
            type: string
        - in: path
          name: passwd
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authenticated
        "401":
          description: Unauthorized

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
